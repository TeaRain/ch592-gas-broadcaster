name: Sync one file from Gitee canonical

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/sync-one-file.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy canonical test file from Gitee
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 \
            "https://gitee.com/zigbridge/gaspulse-firmware/raw/master/tests/test_firmware_tools.py" \
            -o tests/test_firmware_tools.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- tests/test_firmware_tools.py; then
            echo "already in sync"
            exit 0
          fi
          git add tests/test_firmware_tools.py
          git commit -m "test: align test_firmware_tools.py with Gitee canonical"
          git push
