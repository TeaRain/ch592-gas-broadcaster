name: Sync from canonical Gitee

on:
  push:
    branches: [master]
    paths: ['.github/workflows/sync-canonical.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync all files from canonical Gitee master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cloned=false
          for attempt in 1 2 3 4; do
            rm -rf /tmp/gaspulse-firmware-canonical
            if timeout 120 git clone --depth 1 https://gitee.com/zigbridge/gaspulse-firmware.git /tmp/gaspulse-firmware-canonical; then
              cloned=true
              break
            fi
            sleep 10
          done
          "$cloned"
          rsync -a --delete \
            --exclude=.git \
            --exclude=.github/workflows/sync-canonical.yml \
            /tmp/gaspulse-firmware-canonical/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to sync"
          else
            git commit -m "chore: sync byte-exact files from canonical Gitee master"
            git push
          fi
